<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skimline</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="yvpm-appbar">
      <div class="yvpm-brand" aria-label="Skimline">
        <span class="yvpm-brand-mark" aria-hidden="true">≋</span>
        <span class="yvpm-brand-name">Skimline</span>
      </div>
      <div class="yvpm-app-controls">
        <button
          id="yvpm-library-button"
          class="yvpm-library-button"
          type="button"
          aria-label="打开洞见库"
          aria-pressed="false"
        >
          <span class="yvpm-library-icon" aria-hidden="true"></span>
          <span id="yvpm-library-count" class="yvpm-library-count" hidden>0</span>
        </button>
        <div class="yvpm-text-scale-control" role="group" aria-label="文字大小">
          <div class="yvpm-text-scale-rail">
            <input
              id="yvpm-text-scale"
              type="range"
              min="85"
              max="125"
              step="1"
              value="100"
              aria-label="调整整个侧栏的文字大小"
              aria-valuetext="100%，标准"
            />
            <span class="yvpm-text-scale-ticks" aria-hidden="true"></span>
          </div>
          <div class="yvpm-text-scale-meta">
            <span class="yvpm-text-scale-label" aria-hidden="true">TEXT</span>
            <button
              id="yvpm-text-scale-reset"
              type="button"
              title="恢复默认文字大小"
              aria-label="恢复默认文字大小，当前为 100%"
            >
              100%
            </button>
          </div>
        </div>
        <div class="yvpm-language-control">
          <button
            id="yvpm-language-button"
            class="yvpm-language-button"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span id="yvpm-language-label">简体中文</span>
            <span aria-hidden="true">⌄</span>
          </button>
          <div
            id="yvpm-language-menu"
            class="yvpm-language-menu"
            role="listbox"
            aria-label="摘要语言"
            hidden
          >
            <button type="button" role="option" data-language="auto">自动（跟随 Chrome）</button>
            <button type="button" role="option" data-language="zh-CN">简体中文</button>
            <button type="button" role="option" data-language="zh-TW">繁體中文</button>
            <button type="button" role="option" data-language="en">English</button>
            <button type="button" role="option" data-language="ja">日本語</button>
            <button type="button" role="option" data-language="ko">한국어</button>
            <button type="button" role="option" data-language="es">Español</button>
          </div>
        </div>
      </div>
    </header>
    <main id="yvpm-panel" aria-label="Skimline 视频提纲">
      <section id="yvpm-prepare" class="yvpm-prepare" hidden>
        <div class="yvpm-prepare-card">
          <span class="yvpm-prepare-label">准备生成摘要</span>
          <h2>选择这次的摘要语言</h2>
          <p id="yvpm-prepare-copy">摘要将使用右上角选择的语言呈现。</p>
          <div class="yvpm-prepare-actions">
            <span class="yvpm-countdown"><strong id="yvpm-countdown">6</strong> 秒后自动开始</span>
            <button id="yvpm-generate-now" type="button">立即生成</button>
          </div>
        </div>
        <p class="yvpm-privacy-note">摘要内容会发送至你配置的模型服务。同一视频的不同语言版本会分别保存在本地。</p>
      </section>
      <div id="yvpm-generation-bar" class="yvpm-generation-bar" hidden>
        <span><span class="yvpm-spinner" aria-hidden="true"></span><span id="yvpm-generation-copy">正在生成简体中文摘要…</span></span>
        <button id="yvpm-change-language" type="button">更改语言</button>
      </div>
      <div id="yvpm-empty" class="yvpm-empty" hidden>
        打开一个 YouTube 视频即可生成观点地图
      </div>
      <section id="yvpm-overview" class="yvpm-overview" aria-live="polite" hidden>
        <span class="yvpm-overview-label">概览</span>
        <p id="yvpm-overview-text"></p>
        <button id="yvpm-overview-retry" type="button" hidden>重试概览</button>
      </section>
      <section id="yvpm-intent" class="yvpm-intent" hidden>
        <h2>你想从这期视频中获得什么？</h2>
        <form id="yvpm-intent-form" class="yvpm-intent-form">
          <input
            id="yvpm-intent-input"
            type="text"
            maxlength="200"
            autocomplete="off"
            aria-label="观看需求"
            placeholder="例如：我是研究生，想了解他的科研成长路径"
          />
          <button id="yvpm-intent-submit" type="submit">帮我找</button>
        </form>
        <div id="yvpm-intent-chips" class="yvpm-intent-chips" aria-label="推荐观看需求"></div>
        <div id="yvpm-intent-feedback" class="yvpm-intent-feedback" hidden aria-live="polite"></div>
      </section>
      <div id="yvpm-matchbar" class="yvpm-matchbar" hidden aria-live="polite">
        <span id="yvpm-matchbar-text"></span>
        <div class="yvpm-matchbar-actions">
          <button id="yvpm-match-clear" class="yvpm-match-clear" type="button">清除</button>
          <button id="yvpm-match-prev" class="yvpm-match-nav" type="button" aria-label="上一个推荐">↑</button>
          <button id="yvpm-match-next" class="yvpm-match-nav" type="button" aria-label="下一个推荐">↓</button>
        </div>
      </div>
      <div id="yvpm-list-heading" class="yvpm-list-heading" hidden>
        <strong id="yvpm-list-heading-title">关键章节</strong>
        <div class="yvpm-list-heading-actions">
          <span id="yvpm-list-heading-meta"></span>
          <button
            id="yvpm-follow-playback"
            class="yvpm-follow-playback"
            type="button"
            aria-pressed="false"
            aria-label="跟随播放已关闭"
          >
            <span class="yvpm-follow-playback-dot" aria-hidden="true"></span>
            <span>跟随播放</span>
          </button>
        </div>
      </div>
      <div id="yvpm-list" role="list"></div>
      <div id="yvpm-progress" class="yvpm-progress" hidden aria-live="polite">
        <span id="yvpm-progress-text"></span>
        <span class="yvpm-progress-shimmer" aria-hidden="true"></span>
      </div>
      <div id="yvpm-status" hidden></div>
    </main>
    <section id="yvpm-library" class="yvpm-library" aria-label="洞见库" hidden>
      <header class="yvpm-library-header">
        <button id="yvpm-library-back" class="yvpm-library-back" type="button">
          <span aria-hidden="true">‹</span> 返回
        </button>
        <div>
          <h2>洞见库</h2>
          <p id="yvpm-library-total">0 条收藏</p>
        </div>
        <div class="yvpm-library-backup-actions" aria-label="收藏备份">
          <button id="yvpm-library-export" type="button">导出</button>
          <button id="yvpm-library-import" type="button">导入</button>
          <input
            id="yvpm-library-import-file"
            type="file"
            accept=".json,application/json"
            hidden
          />
        </div>
      </header>
      <div class="yvpm-library-search-wrap">
        <span class="yvpm-library-search-icon" aria-hidden="true"></span>
        <input
          id="yvpm-library-search"
          type="search"
          autocomplete="off"
          aria-label="搜索收藏内容或视频标题"
          placeholder="搜索收藏内容或视频标题"
        />
        <button
          id="yvpm-library-search-clear"
          class="yvpm-library-search-clear"
          type="button"
          aria-label="清除搜索"
          hidden
        >×</button>
      </div>
      <div id="yvpm-library-list" class="yvpm-library-list" role="list"></div>
      <div id="yvpm-library-empty" class="yvpm-library-empty" hidden>
        <span class="yvpm-library-empty-mark" aria-hidden="true">◇</span>
        <h2 id="yvpm-library-empty-title">还没有收藏</h2>
        <p id="yvpm-library-empty-copy">在摘要中圈选一段文字，就可以把它留在这里。</p>
      </div>
    </section>
    <div
      id="yvpm-explain-menu"
      class="yvpm-explain-menu"
      role="menu"
      aria-label="所选文字操作"
      hidden
    >
      <button id="yvpm-explain-selection" type="button" role="menuitem">
        <span aria-hidden="true">✦</span>解释
      </button>
      <button id="yvpm-save-selection" type="button" role="menuitem">
        <span aria-hidden="true">◇</span>收藏
      </button>
      <button id="yvpm-copy-selection" type="button" role="menuitem">
        <span aria-hidden="true">□</span>复制
      </button>
    </div>
    <div
      id="yvpm-explanation-scrim"
      class="yvpm-explanation-scrim"
      aria-hidden="true"
      data-state="closed"
      hidden
    ></div>
    <article
      id="yvpm-explanation-drawer"
      class="yvpm-explanation-drawer"
      role="dialog"
      aria-modal="true"
      aria-labelledby="yvpm-explanation-title"
      aria-hidden="true"
      data-state="closed"
      inert
      hidden
    >
      <div class="yvpm-explanation-grabber" aria-hidden="true"></div>
      <header class="yvpm-explanation-header">
        <div>
          <span class="yvpm-explanation-label">AI 上下文解释</span>
          <h2 id="yvpm-explanation-title"></h2>
        </div>
        <button id="yvpm-explanation-close" class="yvpm-explanation-close" type="button">
          收起 <span aria-hidden="true">↓</span>
        </button>
      </header>
      <div
        id="yvpm-explanation-body"
        class="yvpm-explanation-body"
        aria-live="polite"
        data-explanation-scroll
      ></div>
      <button
        id="yvpm-explanation-latest"
        class="yvpm-explanation-latest"
        type="button"
        hidden
      >↓ 回到最新回答</button>
      <footer
        id="yvpm-explanation-composer"
        class="yvpm-explanation-composer"
      ></footer>
    </article>
    <div id="yvpm-toast" class="yvpm-toast" role="status" aria-live="polite" hidden>
      <span id="yvpm-toast-message">选择新的摘要语言后会重新生成。</span>
      <button id="yvpm-toast-action" type="button" hidden></button>
    </div>
    <script src="collection-utils.js"></script>
    <script src="ui-utils.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
